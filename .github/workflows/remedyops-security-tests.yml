name: RemedyOps security regression tests

on:
  pull_request:
    paths:
      - "remedyops-ai/**"
      - ".github/workflows/remedyops-security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "remedyops-ai/requirements.txt"
      - name: Install test dependencies
        run: python -m pip install -r remedyops-ai/requirements.txt
      - name: Run unit and isolated integration tests
        working-directory: remedyops-ai
        run: python -m pytest -q tests
      - name: Build sandbox image (packaging smoke test)
        run: docker build -t remedyops-ai-security-ci ./remedyops-ai

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RemedyOps AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1424;color:#e5edf8;font:15px system-ui}main{max-width:1000px;margin:32px auto;padding:16px}h1{margin:0}h2{font-size:18px;margin-top:0}.muted{color:#9db0c8}.card{background:#17243a;border:1px solid #31445d;border-radius:12px;padding:20px;margin:16px 0}input{background:#0e192a;color:white;border:1px solid #49617c;border-radius:7px;padding:10px;margin:5px;max-width:100%}button{border:0;border-radius:8px;background:#357de4;color:white;padding:11px 14px;cursor:pointer;margin:5px}button:hover{background:#2667bd}pre{background:#0c1424;padding:14px;border-radius:8px;overflow:auto;white-space:pre-wrap;max-height:330px}.warn{color:#f6bd69}.pill{background:#273e58;padding:5px 10px;border-radius:30px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}label{display:block;padding:7px 0}input[type=checkbox]{margin-right:8px}</style></head><body><main>
<h1>RemedyOps AI <span class="pill">Web v0.2</span></h1><p class="muted">서버 자산 DB 관리 · 로컬 샌드박스 자동 조치 · 선택적 원복</p>
<div class="card"><h2>대시보드</h2><div id="stats">로딩 중...</div></div>
<div class="card"><h2>서버 등록 (접속 정보 메타데이터만 저장)</h2><form id="assetForm"><div class="row"><input id="name" placeholder="서버 이름" required><input id="host" placeholder="IP 또는 호스트명" required><input id="port" type="number" value="22" min="1" max="65535" required><input id="username" placeholder="SSH 사용자" required></div><button>DB에 서버 등록</button></form><div id="assets"></div></div>
<div class="card"><h2>취약점 조치 계획 — 샌드박스 전용</h2>
<label><input class="finding" type="checkbox" value="LOG-001" checked>LOG-001 — 감사 로그 활성화 (저위험)</label>
<label><input class="finding" type="checkbox" value="PERM-001" checked>PERM-001 — 파일 권한 설정 (저위험)</label>
<label><input class="finding" type="checkbox" value="SSH-001" checked>SSH-001 — SSH 암호 인증 차단 (고위험 · 자동 실행 금지)</label>
<button onclick="plan()">조치 계획 생성</button><button onclick="apply()">승인 후 샌드박스 적용</button><pre id="planResult">계획 없음</pre></div>
<div class="card"><h2>선택적 원복 센터</h2><button onclick="refresh()">변경 이력 새로고침</button><div id="changes"></div><button onclick="rollback()">선택 항목 원복</button><pre id="rollbackResult">원복 기록 없음</pre></div>
<p class="warn">⚠ 이 앱은 로컬 개발 데모입니다. 인증/RBAC, SSH 연결, AI 분석, 실제 서버 조치, 장애 감지 자동 원복 기능이 없습니다. 외부 공개 및 운영망 사용 금지.</p></main>
<script>
let currentPlan=null;
async function api(path,method='GET',body){const res=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw Error(JSON.stringify(data.detail||data));return data}
async function refresh(){try{const [stats,assets,changes]=await Promise.all([api('dashboard'),api('assets'),api('changes')]);document.getElementById('stats').textContent='등록 서버 '+stats.assets+'대 · 감사 이벤트 '+stats.events+'건';document.getElementById('assets').textContent=assets.length?assets.map(a=>a.name+' ('+a.username+'@'+a.host+':'+a.port+')').join(' / '):'등록된 서버 없음';const el=document.getElementById('changes');el.replaceChildren();for(const c of changes){const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.className='change';cb.value=c.change_id;cb.disabled=c.status!=='applied';label.append(cb,document.createTextNode(c.finding_id+' — '+c.status+' / '+c.change_id.slice(0,8)));el.append(label)}}catch(e){alert(e.message)}}
document.getElementById('assetForm').onsubmit=async e=>{e.preventDefault();try{await api('assets','POST',{name:document.getElementById('name').value,host:document.getElementById('host').value,port:Number(document.getElementById('port').value),username:document.getElementById('username').value});await refresh()}catch(e){alert(e.message)}};
async function plan(){try{const finding_ids=[...document.querySelectorAll('.finding:checked')].map(x=>x.value);const result=await api('plan','POST',{finding_ids});currentPlan=result.plan_id;document.getElementById('planResult').textContent=JSON.stringify(result,null,2)}catch(e){alert(e.message)}}
async function apply(){if(!currentPlan)return alert('계획부터 생성하세요');if(!confirm('로컬 샌드박스 설정 변경을 승인합니까?'))return;try{const result=await api('apply','POST',{plan_id:currentPlan,approved:true});document.getElementById('planResult').textContent=JSON.stringify(result,null,2);await refresh()}catch(e){alert(e.message)}}
async function rollback(){const change_ids=[...document.querySelectorAll('.change:checked')].map(x=>x.value);if(!change_ids.length)return alert('원복 항목을 선택하세요');if(!confirm('선택한 샌드박스 변경을 원복합니까?'))return;try{const result=await api('rollback','POST',{change_ids,approved:true});document.getElementById('rollbackResult').textContent=JSON.stringify(result,null,2);await refresh()}catch(e){alert(e.message)}}
refresh();
</script></body></html>
